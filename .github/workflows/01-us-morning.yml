name: 美股盘后复盘

# 推送时间：北京时间 07:30
#   美股收盘 = 美东 16:00 = 北京时间 04:00（夏令时）/ 05:00（冬令时）
#   07:30 推送 = 收盘后 2.5~3.5 小时，行情数据已落定，你起床就能看到
#   cron 用 UTC：北京时间 07:30 = UTC 前一天 23:30
#   UTC 周一至周五 23:30 → 北京时间 周二至周六 07:30（正好覆盖美东周一至周五收盘）
on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

concurrency:
  group: us-stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: mkdir -p data logs reports

      - name: 执行美股盘后分析并推送
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          MARKET_REVIEW_REGION: us
          STOCK_LIST: ${{ vars.US_STOCK_LIST || 'QQQ,SPY,TQQQ,SOXX,SOXL,DRAM,RAM,CRCL' }}
          REPORT_TYPE: simple
          REPORT_LANGUAGE: zh
          MARKET_REVIEW_ENABLED: 'true'
          NEWS_INTEL_AUTO_FETCH_ENABLED: 'true'
        run: python main.py --force-run
